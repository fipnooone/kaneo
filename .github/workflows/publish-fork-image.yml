name: Publish fork image

on:
  push:
    branches:
      - fix/mcp-api-key-auth-20261109
    paths:
      - .github/workflows/publish-fork-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.server_url == 'https://github.com' && github.repository == 'fipnooone/kaneo'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/kaneo" >> "$GITHUB_OUTPUT"
          echo "tag=mcp-api-key-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Write deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published Kaneo image"
            echo
            printf 'Tag: `%s:%s`\n' "$IMAGE" "$TAG"
            echo
            echo "Pinned deployment reference:"
            echo '```yaml'
            echo "image: ${IMAGE}:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
